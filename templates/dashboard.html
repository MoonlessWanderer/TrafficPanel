{% extends "base.html" %}
{% block content %}
<header class="page-head"><div><h1>Dashboard</h1><p>Live node status and usage for the selected range.</p></div></header>
<div id="state" class="state">Loading…</div>
<section id="cards" class="cards" aria-label="Summary"></section>
<section class="split">
  <article class="card"><header><h2>Traffic</h2></header><div class="chart-box"><canvas id="traffic-chart"></canvas></div></article>
  <article class="card"><header><h2>Resources</h2></header><div class="chart-box"><canvas id="resource-chart"></canvas></div></article>
</section>
<section class="split">
  <article class="card"><header><h2>Top nodes</h2></header><div id="top-nodes"></div></article>
  <article class="card"><header><h2>Top groups</h2></header><div id="top-groups"></div></article>
</section>
<section class="split">
  <article class="card"><header><h2>Alerts</h2></header><div id="dash-alerts" class="feed"></div></article>
  <article class="card"><header><h2>Recent activity</h2></header><div id="dash-activity" class="feed"></div></article>
</section>
{% endblock %}
