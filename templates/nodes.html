{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <div><h1>Nodes</h1><p>Each server connects with its own id and key.</p></div>
  <button class="btn" id="new-node" type="button">New node</button>
</header>
<form id="node-filters" class="filters">
  <div class="filter-primary">
    <label>Search<input name="q" placeholder="Name or node id"></label>
    <label>Status
      <select name="status">
        <option value="">All</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
        <option value="disabled">Disabled</option>
      </select>
    </label>
    <label>Group<select name="group_ids" id="group-filter"><option value="">All</option></select></label>
    <button class="btn" type="submit">Apply filters</button>
  </div>
  <details class="filter-more" id="more-filters">
    <summary>More filters</summary>
    <div class="filter-grid">
      <label>Traffic
        <select name="traffic">
          <option value="total">Total</option>
          <option value="rx">Download</option>
          <option value="tx">Upload</option>
        </select>
      </label>
      <label>Minimum traffic<input name="traffic_min" inputmode="numeric" placeholder="bytes"></label>
      <label>Maximum traffic<input name="traffic_max" inputmode="numeric" placeholder="bytes"></label>
      <label>Minimum CPU<input name="cpu_min" inputmode="decimal"></label>
      <label>Maximum CPU<input name="cpu_max" inputmode="decimal"></label>
      <label>Minimum RAM<input name="ram_min" inputmode="decimal"></label>
      <label>Maximum RAM<input name="ram_max" inputmode="decimal"></label>
      <label>Minimum disk<input name="disk_min" inputmode="decimal"></label>
      <label>Maximum disk<input name="disk_max" inputmode="decimal"></label>
    </div>
  </details>
</form>
<div id="state" class="state">Loading…</div>
<div class="table-wrap"><table><thead><tr><th>Node</th><th>Status</th><th>Download</th><th>Upload</th><th>Traffic</th><th>CPU</th></tr></thead><tbody id="node-rows"></tbody></table></div>
<nav id="pager" class="pager" aria-label="Pages"></nav>
{% endblock %}
